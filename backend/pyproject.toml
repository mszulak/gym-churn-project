[project]
name = "backend"
version = "0.1.0"
description = "Backend for churn prediction app"
requires-python = "==3.12.*"
dependencies = [
    "celery>=5.7.0",
    "fastapi[standard]>=0.162.2",
    "joblib>=1.6.0",
    "packaging>=26.3",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
