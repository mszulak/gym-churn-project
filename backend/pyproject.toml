[project]
name = "backend"
version = "0.1.0"
description = "Backend for churn prediction app"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
