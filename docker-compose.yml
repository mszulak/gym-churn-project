services:
  db:
    image: postgres:16-alpine
    container_name: gym_churn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gym_churn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_churn"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: "./backend"
    container_name: gym_churn_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/gym_churn
      SECRET_KEY: development_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./local_storage:/app/local_storage
volumes:
  postgres_data:
